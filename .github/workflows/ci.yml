name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

# Called workflows inherit github.workflow from their caller. The ci- prefix
# keeps this group distinct from release publication concurrency.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint, types, and generated exports
        run: python scripts/ci_full.py --only lint types stubs

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[test]"
      - name: Python tests
        run: python scripts/ci_full.py --only tests

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.14"
      - name: Install locked baseline environment
        run: uv sync --locked --python 3.13
      - name: Deterministic baseline digests
        run: uv run --no-sync --python 3.13 python scripts/ci_full.py --only baseline

  rust-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust checks and tests
        run: python scripts/ci_full.py --only rust

  wheel-build:
    uses: ./.github/workflows/wheel-build.yml

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, baseline, rust-gate, wheel-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"Required CI jobs did not succeed: {failures}")
          PY
