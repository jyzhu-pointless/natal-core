name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Layer 1: lint + types + stub consistency (fail fast) ────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright numpy
      - name: Ruff
        run: ruff check src demos
      - name: Pyright (strict)
        run: pyright
      - name: Stub regeneration must be a no-op
        run: |
          python scripts/generate_init_pyi.py
          git diff --exit-code src/natal/__init__.pyi

  # ── Layer 2: full test suite across Python versions ─────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Pytest
        run: pytest -q

  # ── Layer 3: numeric lock — deterministic outputs bit-identical ─────────
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Phase-0 baseline digests
        run: python scripts/phase0_baseline.py --check

  # ── Layer 4: Rust gate (fmt + clippy + check) ───────────────────────────
  rust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust gate
        run: python scripts/check_rust.py

  # ── Layer 5: wheel buildability (no publish) ────────────────────────────
  wheel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: true
          manylinux: auto
      - name: Smoke-test the built wheel
        run: |
          pip install dist/*.whl
          python -c "import natal; print('wheel import ok, version', natal.__version__)"
