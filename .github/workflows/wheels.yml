name: wheels

# Release workflow for the mixed maturin package (current single-package form).
# Phase 5 splits this into natal (pure Python) + natal-engine-rs (abi3 wheels);
# this file will be restructured then.  Publishes ONLY on version tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels without publishing"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Covers the mainstream scientific platforms.  abi3 wheels (Phase 5)
        # will collapse the python dimension to a single entry per platform.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: true
          manylinux: auto
      - name: Validate wheel metadata
        run: pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      # Trusted publishing (OIDC): no API tokens to manage.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Pre-release tags like v0.2.0b1 must reach the pre-release channel.
          skip-existing: true
