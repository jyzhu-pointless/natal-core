name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all release checks without publishing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # CI builds and tests the artifacts for this exact tag/selected ref. Upload
  # reuses those artifacts; there is no second, untested release build.
  checks:
    uses: ./.github/workflows/ci.yml

  release-identity:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - name: Require matching tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_wheel.py --check-tag "$RELEASE_TAG"

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    needs: [checks, release-identity]
    runs-on: ubuntu-24.04
    environment: pypi
    timeout-minutes: 15
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish verified wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
