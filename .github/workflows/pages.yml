name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "natal.svg"
      - "natal-brand.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use current project branding
        run: |
          cp natal.svg website/natal.svg
          cp natal-brand.svg website/assets/natal-brand.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
