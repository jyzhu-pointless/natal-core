name: wheel-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: wheel ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build one release wheel
        uses: PyO3/maturin-action@v1
        with:
          # manylinux uses its own interpreter catalog; native jobs use the
          # single interpreter selected by setup-python (including Windows).
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && format('python{0}', matrix.python-version) || 'python' }}
          sccache: true
          manylinux: auto
      - name: Install verification tools
        run: python -m pip install twine packaging tomli
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install exact wheel in isolation and run E2E tests
        run: python scripts/verify_wheel.py --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
