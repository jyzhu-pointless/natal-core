site_name: NATAL Core 中文文档
site_description: Numerical Aggregation Toolkit for Analysis of Lifecycles
site_author: Jinyu Zhu

docs_dir: docs/zh

hooks:
  - docs/hooks.py

repo_url: https://github.com/jyzhu-pointless/natal-core
repo_name: jyzhu-pointless/natal-core

watch:
  - src/

theme:
  name: material
  language: zh
  logo: natal-doc.svg
  favicon: natal.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - toc:
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - autorefs:
      resolve_closest: true
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2
            merge_init_into_class: true
            show_if_no_docstring: false
            show_submodules: false
            show_object_full_path: false
            group_by_category: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"
            warn_no_docstring: true

nav:
